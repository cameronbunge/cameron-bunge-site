<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hub — Cameron Bunge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wdth,wght@62..125,100..900&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* THE HUB — the site's back room, on the site itself. One tab per section: drop pictures and films in, arrange them, write the words,
     add projects; then PUBLISH sends everything to the repository the site is served from (store.js), live within a minute or so.
     Nothing here needs Claude. Changes wait in this browser until published, so a closed tab loses nothing. */
  :root { --bg: #fff; --ink: #111; --muted: #8a8a8a; --pale: #c9c9c9; --cell: #f0f0f0; --display: "Archivo", Helvetica, Arial, sans-serif; --black: "Archivo Black", "Arial Black", Helvetica, Arial, sans-serif; --mono: "Space Mono", monospace; --gutter: clamp(16px, 1.8vw, 32px); color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--display); font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased; padding: 14px var(--gutter) 160px; }
  a { color: inherit; text-decoration: none; }
  button { all: unset; cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }
  input, textarea { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); font-weight: 700; font-size: 10.5px; letter-spacing: 0.02em; }
  .b { color: var(--muted); }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 22px; }
  h1 { margin: 0; font-family: var(--black); font-weight: 400; font-size: clamp(22px, 2.6vw, 40px); letter-spacing: -0.045em; line-height: 0.9; text-transform: uppercase; }
  .how { max-width: 60ch; font-size: 13px; margin: 10px 0 0; }
  .state { text-align: right; flex: 0 0 auto; display: grid; gap: 6px; justify-items: end; }
  .state .mono { color: var(--muted); }
  .state .mono.on { color: var(--ink); }
  .state button:hover, .state a:hover, .tabs a:hover, .tools button:hover, .add:hover, .lnk:hover { text-decoration: underline; text-underline-offset: 3px; }
  #publish { color: var(--muted); border: 1px solid var(--pale); padding: 5px 9px; }
  #publish.on { color: var(--ink); border-color: var(--ink); }
  #publish.on .b { color: var(--muted); }
  .pubrow { display: flex; align-items: center; gap: 10px; }
  .panel { border: 1px solid var(--ink); padding: 12px 14px; margin: 0 0 22px; max-width: 76ch; }
  .panel p { margin: 0 0 8px; }
  .panel input[type="password"], .panel input[type="text"] { all: unset; font-family: var(--mono); font-size: 11px; border-bottom: 1px solid var(--pale); min-width: 36ch; padding: 2px 0; }
  .panel input:focus { border-bottom-color: var(--ink); }
  .panel .row { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 30px; }
  .tabs a { padding: 2px 0; }
  .tabs a.on { text-decoration: underline; text-underline-offset: 4px; }

  .cat { margin-bottom: 44px; }
  .cat h2 { margin: 0 0 10px; font-family: var(--black); font-weight: 400; font-size: clamp(20px, 2.9vw, 42px); letter-spacing: -0.04em; line-height: 1.08; text-transform: uppercase; }
  .cat h2 input { all: unset; font: inherit; letter-spacing: inherit; text-transform: inherit; min-width: 8ch; border-bottom: 1px solid transparent; }
  .cat h2 input:hover, .cat h2 input:focus { border-bottom-color: var(--pale); }
  .cathead { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
  .cathead .meta input { all: unset; font-family: var(--mono); font-weight: 700; font-size: 10.5px; letter-spacing: 0.02em; min-width: 20ch; border-bottom: 1px solid var(--pale); }
  .cathead .tools { margin-left: auto; }
  .zone { display: flex; flex-wrap: wrap; gap: 6px; min-height: 86px; padding: 6px; border: 1px solid var(--pale); transition: border-color .15s, background .15s; }
  .zone.over { border-color: var(--ink); background: #fafafa; }
  .zone.filedrop { border-style: solid; border-color: var(--ink); background: #fafafa; }
  .pool .zone { border-style: dashed; }
  .lbl { display: flex; align-items: baseline; gap: 12px; margin: 14px 0 6px; flex-wrap: wrap; }
  .lbl .mono { color: var(--muted); }
  .grp .lbl input.name { all: unset; font-family: var(--black); font-weight: 400; font-size: 18px; letter-spacing: -0.03em; text-transform: uppercase; min-width: 12ch; border-bottom: 1px solid var(--pale); padding-bottom: 2px; }
  .grp .lbl input.name.lc { text-transform: none; }
  .grp .lbl input::placeholder { color: var(--pale); }
  .grp .lbl input:focus { border-bottom-color: var(--ink); }
  .grp .lbl .tools { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .th { height: 72px; min-width: 40px; flex: 0 0 auto; cursor: grab; position: relative; background: var(--cell); outline: 1px solid transparent; }
  .th img, .th video { display: block; height: 100%; width: auto; pointer-events: none; }
  .th video { aspect-ratio: auto 3 / 4; }
  .th.new::after { content: "NEW"; position: absolute; left: 2px; bottom: 2px; font-family: var(--mono); font-weight: 700; font-size: 8px; background: var(--ink); color: var(--bg); padding: 1px 3px; }
  .th.drag { opacity: .35; }
  .th.before::before, .th.after::after { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
  .th.before::before { left: -4px; } .th.after::after { right: -4px; }
  .add { display: inline-block; margin-top: 10px; }
  .add .b { color: var(--muted); }
  .frames { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-start; padding-left: 14px; border-left: 1px solid var(--pale); }
  .frm { flex: 0 1 auto; }
  .frm .flbl { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); margin: 0 0 4px; }
  .frm .flbl button:hover { text-decoration: underline; text-underline-offset: 3px; }
  .frm .flbl .b { color: var(--pale); }
  .frm .zone { min-width: 120px; }
  .frames .frm .zone { flex-wrap: nowrap; }
  .add.fadd { margin-top: 0; align-self: center; }
  .th .x { position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; line-height: 16px; text-align: center; background: #fff; color: var(--ink); font-size: 12px; opacity: 0; }
  .th:hover .x { opacity: 1; }
  .lbl .colsw { color: var(--muted); }
  .lbl .colsw input { all: unset; width: 3ch; border-bottom: 1px solid var(--pale); text-align: right; font-family: var(--mono); font-weight: 700; font-size: 10.5px; color: var(--ink); }
  .zone.cols { display: grid; grid-template-columns: repeat(var(--cols, 3), max-content); justify-content: start; }
  /* the words of a project */
  .txt { display: grid; grid-template-columns: 12ch 1fr; gap: 8px 14px; align-items: start; max-width: 90ch; margin: 10px 0 4px; padding: 12px 14px; border: 1px dashed var(--pale); }
  .txt[hidden] { display: none; }
  .txt .k { color: var(--muted); padding-top: 3px; }
  .txt input[type="text"], .txt textarea { all: unset; display: block; width: 100%; font-family: var(--display); font-size: 13px; line-height: 1.45; border-bottom: 1px solid var(--pale); padding: 2px 0 4px; white-space: pre-wrap; }
  .txt textarea { min-height: 3.4em; resize: vertical; }
  .txt input:focus, .txt textarea:focus { border-bottom-color: var(--ink); }
  .txt .checks { display: flex; gap: 14px; flex-wrap: wrap; }
  .txt label { display: inline-flex; gap: 6px; align-items: center; }
  .txt input[type="checkbox"] { accent-color: var(--ink); margin: 0; }
  .txt .danger { grid-column: 2; }
  .newform { display: inline-flex; gap: 10px; align-items: baseline; margin-top: 10px; }
  .newform input { all: unset; font-family: var(--black); font-size: 18px; letter-spacing: -0.03em; text-transform: uppercase; border-bottom: 1px solid var(--ink); min-width: 14ch; }
  /* bio */
  .bio { max-width: 90ch; display: grid; grid-template-columns: 14ch 1fr; gap: 12px 16px; align-items: start; }
  .bio .k { color: var(--muted); padding-top: 3px; }
  .bio textarea, .bio input[type="text"] { all: unset; display: block; width: 100%; font-family: var(--display); font-size: 13px; line-height: 1.5; border-bottom: 1px solid var(--pale); padding: 2px 0 4px; white-space: pre-wrap; text-transform: uppercase; }
  .bio textarea.raw, .bio input.raw { text-transform: none; }
  .bio textarea { min-height: 6em; resize: vertical; }
  .bio textarea:focus, .bio input:focus { border-bottom-color: var(--ink); }
  .bio .note { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  .bio .lines { display: grid; gap: 6px; }
  .bio .lines .ln { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: baseline; }
  .bio .portrait { display: flex; gap: 14px; align-items: flex-start; }
  .bio .portrait img { width: 110px; height: auto; background: var(--cell); }
  .drop { min-height: 72px; border: 1px dashed var(--ink); display: grid; place-items: center; cursor: pointer; color: var(--muted); padding: 10px; text-align: center; }
  .drop.over { background: #fafafa; }
  .drop:hover { color: var(--ink); }
  .restore, .lnk { font-family: var(--mono); font-weight: 700; font-size: 10.5px; color: var(--muted); margin: 0 10px 0 2px; align-self: center; }
  .restore:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .empty { color: var(--pale); align-self: center; padding-left: 6px; }
  details.else { margin-top: 36px; }
  details.else summary { cursor: pointer; list-style: none; color: var(--muted); }
  details.else summary::-webkit-details-marker { display: none; }
  details.else summary:hover { color: var(--ink); }
  details.else .zone { margin-top: 8px; border-style: dotted; }
  details.else .src { width: 100%; margin: 8px 0 2px; color: var(--muted); }
  details.else .th.gone img, details.else .th.gone video { opacity: .5; }
  .log { position: fixed; left: var(--gutter); right: var(--gutter); bottom: 0; background: var(--bg); border-top: 1px solid var(--pale); padding: 8px 0 10px; display: flex; gap: 16px; align-items: baseline; z-index: 5; }
  .log .mono { color: var(--muted); }
  .log .mono.on { color: var(--ink); }
  .log .mono.bad { color: #b00; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Hub</h1>
    <p class="how" id="how"></p>
  </div>
  <div class="state">
    <div class="mono" id="conn"></div>
    <div class="pubrow"><span class="mono" id="state"></span><button id="publish" class="mono" type="button" disabled><span class="b">[</span> PUBLISH <span class="b">]</span></button></div>
    <a class="mono" id="back" href="index.html">[ HOME ]</a>
    <a class="mono" id="placeLink" href="#" hidden title="Open the page with the placing tool on: drag any picture, size it by its corner">[ PLACE ON PAGE → ]</a>
  </div>
</header>
<div id="connect" class="panel mono" hidden>
  <p>THIS BROWSER NEEDS A GITHUB TOKEN TO PUBLISH. MAKE ONE AT <a class="lnk" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GITHUB → SETTINGS → DEVELOPER SETTINGS → FINE-GRAINED TOKENS</a>: REPOSITORY ACCESS <em>ONLY SELECT REPOSITORIES</em> → <span id="repoName"></span>; PERMISSIONS → CONTENTS: <em>READ AND WRITE</em>. PASTE IT HERE. IT STAYS IN THIS BROWSER ONLY.</p>
  <div class="row"><input type="password" id="token" placeholder="github_pat_…" autocomplete="off" spellcheck="false"><button class="mono" id="tokenSave" type="button"><span class="b">[</span> CONNECT <span class="b">]</span></button><span class="mono" id="tokenNote"></span></div>
</div>
<nav class="tabs mono" id="tabs"></nav>
<main id="cats"></main>
<div class="log"><span class="mono" id="log"></span></div>

<script src="js/data.js"></script>
<script>document.write('<script src="js/content.js?v=' + Math.floor(Date.now() / 6e4) + '"><\/script>');</script>
<script src="js/store.js"></script>
<script>
(function () {
  var S = window.SITE, ST = window.SITE_STORE, cats = document.getElementById('cats'), stateEl = document.getElementById('state'), tabsEl = document.getElementById('tabs'), howEl = document.getElementById('how'), back = document.getElementById('back'), logEl = document.getElementById('log');
  var isV = function (src) { return /\.(mp4|webm|mov)$/i.test(src); };
  var real = function (m) { return m && m.src && !m.ph; };
  var flat = function (frames) { return (frames || []).reduce(function (a, f) { return a.concat(f); }, []); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); };
  var PILLARS = S.pillars.filter(function (p) { return p.id !== 'photo'; });   /* the pages a project can sit on */
  function log(t, cls) { logEl.textContent = t || ''; logEl.className = 'mono' + (cls ? ' ' + cls : ''); }

  /* ---- the connection ---- */
  var connEl = document.getElementById('conn'), connect = document.getElementById('connect'), tokenIn = document.getElementById('token'), tokenNote = document.getElementById('tokenNote');
  document.getElementById('repoName').textContent = ST.repo.split('/')[1];
  function drawConn() {
    if (ST.canWrite()) { connEl.innerHTML = 'CONNECTED · ' + ST.repo.toUpperCase() + ' <button class="mono" id="disc" type="button"><span class="b">[</span> DISCONNECT <span class="b">]</span></button>'; connEl.classList.add('on'); connect.hidden = true; document.getElementById('disc').addEventListener('click', function () { if (confirm('Forget the GitHub token in this browser?')) { ST.setToken(''); drawConn(); drawState(); } }); }
    else { connEl.innerHTML = 'NOT CONNECTED — CHANGES STAY IN THIS BROWSER <button class="mono" id="showConn" type="button"><span class="b">[</span> CONNECT GITHUB <span class="b">]</span></button>'; connEl.classList.remove('on'); document.getElementById('showConn').addEventListener('click', function () { connect.hidden = !connect.hidden; if (!connect.hidden) tokenIn.focus(); }); }
  }
  document.getElementById('tokenSave').addEventListener('click', function () {
    var t = tokenIn.value.trim(); if (!t) { tokenNote.textContent = 'PASTE THE TOKEN FIRST'; return; }
    ST.setToken(t); tokenNote.textContent = 'CHECKING…';
    ST.verify().then(function () { tokenNote.textContent = ''; tokenIn.value = ''; drawConn(); drawState(); log('CONNECTED · THIS BROWSER CAN PUBLISH', 'on'); }, function (e) { ST.setToken(''); tokenNote.textContent = (e && e.message || 'NOT ACCEPTED').toUpperCase(); });
  });
  tokenIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('tokenSave').click(); });

  /* ---- publish ---- */
  var pubBtn = document.getElementById('publish');
  function drawState() {
    var ch = ST.changes(), n = ch.length + ST.staged().length, s = ST.status();
    stateEl.textContent = s.t || (n ? n + ' TO PUBLISH · ' + ch.join(' · ') : 'EVERYTHING PUBLISHED');
    stateEl.classList.toggle('on', !!s.on || n > 0);
    pubBtn.disabled = !ST.canWrite() || !!s.busy || !n; pubBtn.classList.toggle('on', n > 0 && ST.canWrite());
    pubBtn.innerHTML = '<span class="b">[</span> PUBLISH' + (n ? ' · ' + n : '') + ' <span class="b">]</span>';
  }
  pubBtn.addEventListener('click', function () { if (!ST.dirty()) return; ST.publish().then(function () { render(); }, function () {}); });
  ST.onChange(drawState);

  /* ---- every picture on the site, by src ---- */
  var all = {}, owner = {}, poster = {};
  function index() {
    all = {}; owner = {}; poster = {};
    S.projects.forEach(function (p) { p.imgs.forEach(function (m) { if (real(m)) { all[m.src] = m; owner[m.src] = owner[m.src] || p.name || p.id; if (m.poster) poster[m.src] = m.poster; } }); });
    S.photo.forEach(function (c) { c.groups.forEach(function (g) { g.imgs.forEach(function (m) { all[m.src] = m; owner[m.src] = owner[m.src] || ('Photo + Video · ' + c.name); }); }); });
  }
  index();
  var removed = [];   /* pictures removed from the site (sort/removed): off every page, waiting in the drawer until restored or purged */
  var isGone = function (src) { return removed.indexOf(src) !== -1; };
  (function () { var rv = ST.get('sort/removed'); if (rv && rv.srcs) removed = rv.srcs.slice(); })();

  /* ---- the sections ---- */
  var sections = [{ id: 'home', label: 'Home', fixed: true, how: 'The first row is the home page at rest: one picture per project, up to seven, in the order of the places on the page (01 big right-middle, 02 far right, 03 top-left corner, 04 bottom-left, 05 bottom left of center, 06 tiny by the name, 07 bottom center). The rows below are what shows while a section is under the pointer. Drag from the drawer at the bottom; drag out to remove. Then PUBLISH.',
    base: function () { return [{ id: 'home', name: '', imgs: [], groups: [{ id: 'home', name: 'On the home page', imgs: S.home.slice() }].concat(S.pillars.filter(function (p) { return p.n; }).map(function (p) { return { id: p.id, name: 'Hovering ' + p.n + ' ' + p.name, imgs: (S.homeHover[p.id] || []).slice() }; })) }]; } }].concat(S.pillars.map(function (p) {
    if (p.id === 'photo') return { id: 'photo', label: (p.n ? p.n + ' ' : '') + p.name, frames: true, how: 'A category is a name on the page; a group is a run of frames under one title; a frame is one click — its pictures show together. Drop pictures or films from your computer onto any frame (or + ADD MEDIA); drag them between frames; + FRAME adds one. Where each picture sits in its frame is set on the page itself (PLACE). × takes a picture off the site. Then PUBLISH.',
      base: function () { return S.photo.map(function (c) { return { id: c.id, name: c.name, imgs: c.groups.reduce(function (a, g) { return a.concat(g.imgs.map(function (m) { return m.src; })); }, []), groups: S.arrangePhoto(c, null).map(function (g) { return { name: g.name, lc: g.lc, frames: g.frames, imgs: flat(g.frames) }; }) }; }); } };
    return { id: p.id, label: (p.n ? p.n + ' ' : '') + p.name, how: 'Each group is a project on the ' + p.name + ' page, in the order the names run. Drop pictures or films from your computer onto a project (or + ADD MEDIA); drag to order them; COLUMNS deals them into rows, then drag any picture to the row it should sit in; UP / DOWN order the projects. TEXT opens the words: the line of terms, the copy, the bullets, which pages it sits on. + NEW PROJECT starts one. × takes a picture off the site. PLACE ON PAGE opens the page with the placing tool. Then PUBLISH.',
      base: function () { var ps = S.projects.filter(function (x) { return (x.pillars || []).indexOf(p.id) !== -1; }); return [{ id: p.id, name: '', imgs: ps.reduce(function (a, x) { return a.concat(x.imgs.filter(real).map(function (m) { return m.src; })); }, []), groups: ps.map(function (x) { return { id: x.id, name: x.name, imgs: x.imgs.filter(real).map(function (m) { return m.src; }) }; }) }]; } };
  })).concat([{ id: 'bio', label: 'Bio', bio: true, how: 'The words of the bio sheet, the contact lines, the portrait, and the Are.na boards behind INSPIRATIONS and the CAMERA ROLL. Then PUBLISH.' }]);
  var cur = null, states = {}, loaded = {}, openTxt = {};
  function fromBase(sec) { return { cats: sec.base().map(function (c) { return { id: c.id, name: c.name, groups: c.groups }; }) }; }
  function baseImgs(sec, cid) { var c = sec.base().filter(function (c) { return c.id === cid; })[0]; return c ? c.imgs : []; }
  function projectOf(id) { return S.projects.filter(function (p) { return p.id === id; })[0] || null; }
  function catOf(id) { return S.photo.filter(function (c) { return c.id === id; })[0] || null; }
  function src(s) { return ST.urlOf(s) || poster[s] || s; }
  function isNew(s) { return !!ST.fileOf(s); }

  function thumb(s) { return '<div class="th' + (isNew(s) ? ' new' : '') + '" draggable="true" data-src="' + esc(s) + '">' + (isV(s) ? '<video src="' + esc(ST.urlOf(s) || s) + '" muted playsinline preload="metadata"></video>' : '<img src="' + esc(src(s)) + '" alt="">') + '<button class="x mono" type="button" data-gone="' + esc(s) + '" aria-label="Remove from the site" title="Remove from the site">×</button></div>'; }
  function addBtn(ci, gi, fi, what) { return '<button class="add mono fadd" data-act="media" data-ci="' + ci + '" data-gi="' + gi + '"' + (fi != null ? ' data-fi="' + fi + '"' : '') + ' title="Pictures: JPEG or PNG. Films: H.264 MP4 up to 60 MB (anything else, send to Claude)"><span class="b">[</span> + ADD MEDIA' + (what ? ' ' + what : '') + ' <span class="b">]</span></button>'; }
  function txtPanel(p, ci, gi) {
    if (!p) return '';
    var on = !!openTxt[p.id];
    return '<div class="txt" data-pid="' + esc(p.id) + '"' + (on ? '' : ' hidden') + '>' +
      '<span class="k mono">TERMS</span><input type="text" data-f="meta" value="' + esc(p.meta) + '" placeholder="Creative direction · photography · 2024" title="The bracketed line under the pictures; separate terms with ·">' +
      '<span class="k mono">COPY</span><textarea data-f="copy" placeholder="Two or three sentences.">' + esc(p.copy) + '</textarea>' +
      '<span class="k mono">BULLETS</span><textarea data-f="bul" placeholder="One per line">' + esc((p.bul || []).join('\n')) + '</textarea>' +
      '<span class="k mono">PAGES</span><div class="checks mono">' + PILLARS.map(function (pl) { return '<label><input type="checkbox" data-pillar="' + pl.id + '"' + ((p.pillars || []).indexOf(pl.id) !== -1 ? ' checked' : '') + '> ' + (pl.n ? pl.n + ' ' : '') + pl.name.toUpperCase() + '</label>'; }).join('') + '</div>' +
      '<span class="k mono">NAME</span><div class="checks mono"><label><input type="checkbox" data-f="lc"' + (p.lc ? ' checked' : '') + '> KEEP ITS LOWERCASE LETTERS</label><label><input type="checkbox" data-f="ph"' + (p.ph ? ' checked' : '') + '> COPY IS A PLACEHOLDER</label></div>' +
      '<span class="k mono">ID</span><span class="mono">' + esc(p.id) + ' · img/' + esc(p.id) + '/</span>' +
      '<span class="k"></span><div class="danger"><button class="mono" data-act="delproj" data-pid="' + esc(p.id) + '"><span class="b">[</span> DELETE THIS PROJECT FROM THE SITE <span class="b">]</span></button></div></div>';
  }
  function render() {
    var sec = cur, st = states[sec.id];
    if (sec.bio) return renderBio();
    st.cats.forEach(function (c) { c.groups.forEach(function (g) { if (g.frames) g.frames = g.frames.map(function (f) { return f.filter(function (s) { return !isGone(s); }); }); g.imgs = (g.frames ? flat(g.frames) : g.imgs).filter(function (s) { return !isGone(s); }); }); });
    var inGroups = {}; st.cats.forEach(function (c) { c.groups.forEach(function (g) { g.imgs.forEach(function (s) { inGroups[s] = 1; }); }); });
